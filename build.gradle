plugins {
	id 'java'
	id 'org.springframework.boot' version '2.7.18'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(8)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	def bootVer = '2.7.18'

	implementation "org.springframework.boot:spring-boot-starter-data-jpa:${bootVer}"
	implementation "org.springframework.boot:spring-boot-starter-validation:${bootVer}"
	implementation "org.springframework.boot:spring-boot-starter-web:${bootVer}"
	developmentOnly "org.springframework.boot:spring-boot-devtools:${bootVer}"

	runtimeOnly 'com.h2database:h2'

	testImplementation "org.springframework.boot:spring-boot-starter-test:${bootVer}"
}

tasks.named('test') {
	useJUnitPlatform()
}
