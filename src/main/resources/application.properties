server.port=5000

# File-backed H2 (persists under BACKEND/data/ when you run from the BACKEND folder).
# H2 creates klu-app-db.mv.db (and optional .trace.db). Replaces in-memory testdb.
spring.datasource.url=jdbc:h2:file:./data/klu-app-db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
# Same JDBC URL in H2 Console: jdbc:h2:file:./data/klu-app-db

spring.jpa.hibernate.ddl-auto=update
