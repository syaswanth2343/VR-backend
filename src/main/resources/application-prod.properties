# Activate with SPRING_PROFILES_ACTIVE=prod (Railway Variables / host env).
# Do not put passwords in source control — set the three properties below in the dashboard.
#
# Railway gives URLs like: mysql://USER:PASS@HOST:PORT/DB
# Spring needs JDBC, for example:
#   jdbc:mysql://HOST:PORT/DB?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

spring.datasource.hikari.maximum-pool-size=10
